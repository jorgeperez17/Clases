<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Python para negocios, datos e IA · Presentación Web</title><style>
:root{--bg:#08111f;--panel:#0d1727;--line:#213047;--text:#f5f7fb;--muted:#9fb0c8;--blue:#2d6cdf;--cyan:#17b7c7;--green:#16b77c;--radius:16px}
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
body{display:grid;grid-template-rows:56px 1fr 64px}.topbar{display:flex;align-items:center;gap:12px;padding:0 18px;background:rgba(8,17,31,.96);border-bottom:1px solid var(--line);z-index:20}
.brand{font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tag{font-size:12px;color:#c8d4e6;background:#12243d;padding:5px 9px;border-radius:999px}.spacer{flex:1}.iconbtn{border:1px solid var(--line);background:#0f1b2d;color:var(--text);border-radius:10px;height:36px;min-width:36px;padding:0 10px;cursor:pointer;font-size:15px}.iconbtn:hover{background:#16263d}.stage{position:relative;display:flex;align-items:center;justify-content:center;padding:18px;min-height:0}.slide-shell{position:relative;width:min(92vw,calc((100vh - 156px)*16/9));aspect-ratio:16/9;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.45)}.slide-shell img{width:100%;height:100%;display:block;object-fit:contain;background:#fff;user-select:none;-webkit-user-drag:none}.hit{position:absolute;top:0;bottom:0;width:28%;z-index:3}.hit.prev{left:0}.hit.next{right:0}.navhint{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(4,11,22,.66);border:1px solid rgba(255,255,255,.2);opacity:0;transition:.18s;pointer-events:none}.hit:hover .navhint{opacity:1}.prev .navhint{left:16px}.next .navhint{right:16px}.bottombar{display:flex;align-items:center;gap:12px;padding:0 18px;background:#0a1423;border-top:1px solid var(--line)}.counter{min-width:92px;font-variant-numeric:tabular-nums;color:#dce5f2}.section{font-size:13px;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.progresswrap{flex:1;height:8px;background:#17243a;border-radius:99px;overflow:hidden;cursor:pointer}.progress{height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));width:0}.help{font-size:12px;color:var(--muted)}
.drawer{position:fixed;top:56px;bottom:64px;left:0;width:min(420px,88vw);background:rgba(10,20,35,.98);border-right:1px solid var(--line);transform:translateX(-102%);transition:.22s;z-index:30;overflow:auto;padding:16px}.drawer.open{transform:translateX(0)}.drawer h2{font-size:16px;margin:4px 0 14px}.sectionbtn{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#0f1b2d;color:#eaf0fa;padding:12px 13px;border-radius:12px;margin:8px 0;cursor:pointer}.sectionbtn:hover{background:#16263d}.sectionbtn small{display:block;color:var(--muted);margin-top:4px}.backdrop{position:fixed;inset:56px 0 64px 0;background:rgba(0,0,0,.35);z-index:25;display:none}.backdrop.show{display:block}
.overview{position:fixed;inset:56px 0 64px 0;background:#08111f;z-index:35;display:none;overflow:auto;padding:24px}.overview.open{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;max-width:1400px;margin:auto}.thumb{background:#0e1a2b;border:1px solid var(--line);border-radius:12px;padding:8px;cursor:pointer}.thumb:hover{border-color:#3f7be8;transform:translateY(-1px)}.thumb img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:#fff}.thumbmeta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);padding:8px 2px 2px}.kbd{border:1px solid #40516a;background:#122238;border-radius:5px;padding:1px 5px;color:#dde7f5}
.toast{position:fixed;right:18px;bottom:82px;background:#13233a;border:1px solid var(--line);padding:10px 14px;border-radius:10px;color:#dce8f7;z-index:60;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translateY(0)}
@media(max-width:700px){body{grid-template-rows:52px 1fr 58px}.topbar{padding:0 10px}.stage{padding:8px}.help,.tag{display:none}.bottombar{padding:0 10px}.section{display:none}.slide-shell{width:100%;border-radius:8px}}
</style></head><body>
<header class="topbar"><button class="iconbtn" id="menuBtn" title="Índice (M)">☰</button><div class="brand">Python para negocios, datos e inteligencia artificial</div><span class="tag">Presentación web · 92 diapositivas</span><div class="spacer"></div><button class="iconbtn" id="overviewBtn" title="Vista general (O)">▦</button><button class="iconbtn" id="fullscreenBtn" title="Pantalla completa (F)">⛶</button></header>
<main class="stage"><div class="slide-shell" id="shell"><img id="slideImg" alt="Diapositiva"><div class="hit prev" id="prevHit"><div class="navhint">‹</div></div><div class="hit next" id="nextHit"><div class="navhint">›</div></div></div></main>
<footer class="bottombar"><button class="iconbtn" id="prevBtn">←</button><div class="counter" id="counter">1 / 92</div><div class="section" id="sectionName">Inicio</div><div class="progresswrap" id="progressWrap"><div class="progress" id="progress"></div></div><button class="iconbtn" id="nextBtn">→</button><div class="help"><span class="kbd">←</span> <span class="kbd">→</span> navegar · <span class="kbd">F</span> pantalla completa</div></footer>
<div class="backdrop" id="backdrop"></div><aside class="drawer" id="drawer"><h2>Índice del curso</h2><div id="sections"></div></aside>
<section class="overview" id="overview"><div class="grid" id="thumbGrid"></div></section><div class="toast" id="toast"></div>
<script>
const images=["assets/slides/page-01.jpg", "assets/slides/page-02.jpg", "assets/slides/page-03.jpg", "assets/slides/page-04.jpg", "assets/slides/page-05.jpg", "assets/slides/page-06.jpg", "assets/slides/page-07.jpg", "assets/slides/page-08.jpg", "assets/slides/page-09.jpg", "assets/slides/page-10.jpg", "assets/slides/page-11.jpg", "assets/slides/page-12.jpg", "assets/slides/page-13.jpg", "assets/slides/page-14.jpg", "assets/slides/page-15.jpg", "assets/slides/page-16.jpg", "assets/slides/page-17.jpg", "assets/slides/page-18.jpg", "assets/slides/page-19.jpg", "assets/slides/page-20.jpg", "assets/slides/page-21.jpg", "assets/slides/page-22.jpg", "assets/slides/page-23.jpg", "assets/slides/page-24.jpg", "assets/slides/page-25.jpg", "assets/slides/page-26.jpg", "assets/slides/page-27.jpg", "assets/slides/page-28.jpg", "assets/slides/page-29.jpg", "assets/slides/page-30.jpg", "assets/slides/page-31.jpg", "assets/slides/page-32.jpg", "assets/slides/page-33.jpg", "assets/slides/page-34.jpg", "assets/slides/page-35.jpg", "assets/slides/page-36.jpg", "assets/slides/page-37.jpg", "assets/slides/page-38.jpg", "assets/slides/page-39.jpg", "assets/slides/page-40.jpg", "assets/slides/page-41.jpg", "assets/slides/page-42.jpg", "assets/slides/page-43.jpg", "assets/slides/page-44.jpg", "assets/slides/page-45.jpg", "assets/slides/page-46.jpg", "assets/slides/page-47.jpg", "assets/slides/page-48.jpg", "assets/slides/page-49.jpg", "assets/slides/page-50.jpg", "assets/slides/page-51.jpg", "assets/slides/page-52.jpg", "assets/slides/page-53.jpg", "assets/slides/page-54.jpg", "assets/slides/page-55.jpg", "assets/slides/page-56.jpg", "assets/slides/page-57.jpg", "assets/slides/page-58.jpg", "assets/slides/page-59.jpg", "assets/slides/page-60.jpg", "assets/slides/page-61.jpg", "assets/slides/page-62.jpg", "assets/slides/page-63.jpg", "assets/slides/page-64.jpg", "assets/slides/page-65.jpg", "assets/slides/page-66.jpg", "assets/slides/page-67.jpg", "assets/slides/page-68.jpg", "assets/slides/page-69.jpg", "assets/slides/page-70.jpg", "assets/slides/page-71.jpg", "assets/slides/page-72.jpg", "assets/slides/page-73.jpg", "assets/slides/page-74.jpg", "assets/slides/page-75.jpg", "assets/slides/page-76.jpg", "assets/slides/page-77.jpg", "assets/slides/page-78.jpg", "assets/slides/page-79.jpg", "assets/slides/page-80.jpg", "assets/slides/page-81.jpg", "assets/slides/page-82.jpg", "assets/slides/page-83.jpg", "assets/slides/page-84.jpg", "assets/slides/page-85.jpg", "assets/slides/page-86.jpg", "assets/slides/page-87.jpg", "assets/slides/page-88.jpg", "assets/slides/page-89.jpg", "assets/slides/page-90.jpg", "assets/slides/page-91.jpg", "assets/slides/page-92.jpg"]; const sections=[{"name": "Inicio", "start": 1, "end": 2}, {"name": "Clase 1 · ¿Para qué sirve Python?", "start": 3, "end": 10}, {"name": "Clase 2 · Variables y operadores", "start": 11, "end": 18}, {"name": "Clase 3 · Decisiones y ciclos", "start": 19, "end": 26}, {"name": "Clase 4 · Colecciones y funciones", "start": 27, "end": 34}, {"name": "Clase 5 · Pandas", "start": 35, "end": 42}, {"name": "Clase 6 · Estadística descriptiva", "start": 43, "end": 50}, {"name": "Clase 7 · Matplotlib", "start": 51, "end": 58}, {"name": "Clase 8 · Tkinter", "start": 59, "end": 66}, {"name": "Clase 9 · Aplicaciones de negocio", "start": 67, "end": 74}, {"name": "Clase 10 · Integración e IA", "start": 75, "end": 82}, {"name": "Clase 11 · Proyecto final", "start": 83, "end": 90}, {"name": "Cierre", "start": 91, "end": 92}]; const total=images.length; let current=0;
const img=document.getElementById('slideImg'), counter=document.getElementById('counter'), progress=document.getElementById('progress'), sectionName=document.getElementById('sectionName');
const drawer=document.getElementById('drawer'), backdrop=document.getElementById('backdrop'), overview=document.getElementById('overview');
function secFor(n){return sections.find(s=>n>=s.start&&n<=s.end)||sections[0]}
function render(push=true){current=Math.max(0,Math.min(total-1,current)); img.src=images[current]; counter.textContent=`${current+1} / ${total}`; progress.style.width=`${(current+1)/total*100}%`; sectionName.textContent=secFor(current+1).name; document.title=`${current+1}/${total} · Python para negocios`; if(push) history.replaceState(null,'',`#slide-${current+1}`); preload(current+1); preload(current-1)}
function preload(i){if(i>=0&&i<total){const x=new Image();x.src=images[i]}}
function go(n){current=n;render();closeDrawer();closeOverview()} function next(){if(current<total-1){current++;render()}} function prev(){if(current>0){current--;render()}}
function openDrawer(){drawer.classList.add('open');backdrop.classList.add('show')} function closeDrawer(){drawer.classList.remove('open');backdrop.classList.remove('show')} function toggleDrawer(){drawer.classList.contains('open')?closeDrawer():openDrawer()}
function openOverview(){if(!document.getElementById('thumbGrid').children.length) buildThumbs(); overview.classList.add('open')} function closeOverview(){overview.classList.remove('open')} function toggleOverview(){overview.classList.contains('open')?closeOverview():openOverview()}
function fs(){if(!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.()}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1300)}
function buildSections(){const c=document.getElementById('sections'); sections.forEach(s=>{const b=document.createElement('button');b.className='sectionbtn';b.innerHTML=`<strong>${s.name}</strong><small>Diapositivas ${s.start}-${s.end}</small>`;b.onclick=()=>go(s.start-1);c.appendChild(b)})}
function buildThumbs(){const g=document.getElementById('thumbGrid'); images.forEach((src,i)=>{const d=document.createElement('div');d.className='thumb';d.innerHTML=`<img loading="lazy" src="${src}"><div class="thumbmeta"><span>${i+1}</span><span>${secFor(i+1).name}</span></div>`;d.onclick=()=>go(i);g.appendChild(d)})}
document.getElementById('prevBtn').onclick=prev;document.getElementById('nextBtn').onclick=next;document.getElementById('prevHit').onclick=prev;document.getElementById('nextHit').onclick=next;document.getElementById('menuBtn').onclick=toggleDrawer;document.getElementById('overviewBtn').onclick=toggleOverview;document.getElementById('fullscreenBtn').onclick=fs;backdrop.onclick=closeDrawer;
document.getElementById('progressWrap').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();go(Math.round((e.clientX-r.left)/r.width*(total-1)))};
document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();next()} else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();prev()} else if(e.key==='Home')go(0); else if(e.key==='End')go(total-1); else if(e.key.toLowerCase()==='f')fs(); else if(e.key.toLowerCase()==='m')toggleDrawer(); else if(e.key.toLowerCase()==='o')toggleOverview(); else if(e.key==='Escape'){closeDrawer();closeOverview()}});
let sx=0;document.getElementById('shell').addEventListener('touchstart',e=>sx=e.changedTouches[0].clientX,{passive:true});document.getElementById('shell').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50) dx<0?next():prev()},{passive:true});
const m=location.hash.match(/slide-(\d+)/); if(m) current=Math.max(0,Math.min(total-1,+m[1]-1)); buildSections();render(false);
</script></body></html>
